services:
  genoma-app:
    build: .
    container_name: genoma-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      GENOMA_DATA_DIR: /data
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - genoma_data:/data

volumes:
  genoma_data:
